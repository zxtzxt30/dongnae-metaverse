<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>참가자 입장 · 온라인 동내관리소</title>
<style>body{margin:12vh auto;padding:24px;max-width:480px;font:18px/1.6 system-ui;color:#143e38;background:#fffdf5}button{font:inherit;padding:8px 16px}</style>
<h1>온라인 동내관리소</h1><p role="status">참가자 입장 화면을 여는 중…</p><button hidden>다시 연결</button>
<script type="module">
const status=document.querySelector('p'),retry=document.querySelector('button');
const invite=new URLSearchParams(location.hash.slice(1)).get('invite');
async function enter(){
 retry.hidden=true;
 if(!invite){status.textContent='행사 참가자 QR을 스캔해 주세요.';return}
 try{
  const source='https://raw.githubusercontent.com/zxtzxt30/dongnae-metaverse/live-endpoint/endpoint.json';
  const response=await fetch(source+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw Error('route');
  const route=await response.json();
  if(!/^https:\/\/[a-z0-9]+\.app\.lhr\.life$/.test(route.origin))throw Error('origin');
  if(Date.now()>=Date.parse(route.end)){status.textContent='행사가 종료되었습니다.';return}
  const url=new URL('/',route.origin);
  url.hash=new URLSearchParams({invite}).toString();
  location.replace(url.href);
 }catch{status.textContent='입장 주소를 확인할 수 없습니다. 잠시 후 다시 연결해 주세요.';retry.hidden=false}
}
retry.onclick=enter;enter();
</script></html>
