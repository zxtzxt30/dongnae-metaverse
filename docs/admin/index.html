<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>관리자 입장 · 온라인 동내관리소</title>
<style>body{margin:12vh auto;padding:24px;max-width:480px;font:18px/1.6 system-ui;color:#143e38;background:#fffdf5}button{font:inherit;padding:8px 16px}</style>
<h1>온라인 동내관리소</h1><p role="status">관리자 입장 주소를 확인하는 중…</p><button hidden>다시 연결</button>
<script type="module">
const status=document.querySelector('p'), retry=document.querySelector('button');
const hostKey=new URLSearchParams(location.hash.slice(1)).get('host');
const hex=bytes=>Array.from(new Uint8Array(bytes),n=>n.toString(16).padStart(2,'0')).join('');
async function enter(){
 retry.hidden=true;
 if(!/^[a-f0-9]{64}$/.test(hostKey||'')){status.textContent='개인 관리자 링크를 열어 주세요.';return}
 try{
  const response=await fetch('https://api.github.com/repos/zxtzxt30/dongnae-metaverse/contents/endpoint.json?ref=live-endpoint',{cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw Error('route');
  const route=JSON.parse(atob((await response.json()).content));
  if(!/^https:\/\/[a-z0-9]+\.app\.lhr\.life$/.test(route.origin))throw Error('origin');
  if(Date.now()>=Date.parse(route.end)){status.textContent='행사가 종료되었습니다.';return}
  const payload=Math.floor(Date.now()/1000)+120+'.'+hex(crypto.getRandomValues(new Uint8Array(16)));
  const encode=s=>new TextEncoder().encode(s);
  const key=await crypto.subtle.importKey('raw',encode(hostKey),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const signature=hex(await crypto.subtle.sign('HMAC',key,encode('dongnae-mobile:'+payload)));
  const url=new URL('/admin',route.origin);
  url.hash=new URLSearchParams({pass:payload+'.'+signature}).toString();
  location.href=url.href;
 }catch{status.textContent='서버 주소를 확인할 수 없습니다. 잠시 후 다시 연결해 주세요.';retry.hidden=false}
}
retry.onclick=enter;enter();
</script></html>
